# Alembic configuration for the PDF chatbot database.
# The database URL is NOT stored here. The app passes it in (see app/database/migrations.py),
# so the same settings (.env) are used for the app and for migrations.

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

# Logging is handled by the application, so no logger sections are configured here.
